<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg: oklch(16% 0.015 60);
  --panel: oklch(23% 0.02 60);
  --panel2: oklch(27% 0.02 60);
  --fg: oklch(95% 0.015 80);
  --muted: oklch(68% 0.03 70);
  --accent: oklch(78% 0.15 55);
  --accent2: oklch(78% 0.13 200);
  --good: oklch(76% 0.14 148);
  --bad: oklch(68% 0.18 25);
  --line: oklch(34% 0.02 60);
}
*{box-sizing:border-box;}
body{margin:0;}
a{color:var(--accent); text-decoration:none;}
a:hover{color:var(--accent2);}
.slide{
  width:1280px; height:720px; background:var(--bg); color:var(--fg);
  font-family:'IBM Plex Sans', system-ui, sans-serif;
  padding:60px 76px 56px; display:flex; flex-direction:column; gap:22px;
  position:relative; overflow:hidden;
}
.eyebrow{font-family:'Space Grotesk',sans-serif; font-weight:600; letter-spacing:.16em; text-transform:uppercase; font-size:14px; color:var(--accent); margin:0;}
.eyebrow.cool{color:var(--accent2);}
.eyebrow.warn{color:var(--bad);}
h1{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:46px; line-height:1.12; margin:0; letter-spacing:-.01em;}
h2{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:24px; margin:0;}
.pageno{position:absolute; top:60px; right:76px; font-size:13px; color:var(--muted); font-family:'Space Grotesk',sans-serif;}
.foot{position:absolute; left:76px; right:76px; bottom:32px; display:flex; justify-content:space-between; font-size:12px; color:var(--muted); border-top:1px solid var(--line); padding-top:12px; font-family:'Space Grotesk',sans-serif; letter-spacing:.02em;}
.body{flex:1; display:flex; flex-direction:column; gap:24px; min-height:0;}
p{margin:0; font-size:17px; line-height:1.55; color:var(--fg);}
.muted{color:var(--muted);}

.title-wrap{flex:1; display:flex; flex-direction:column; justify-content:center; gap:26px; max-width:920px;}
.headline{font-size:64px; line-height:1.06;}
.subline{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:26px; color:var(--accent2);}
.lede{font-size:19px; color:var(--muted); max-width:680px;}
</style>
</helmet>
<div class="slide">
  <svg width="440" height="440" viewBox="0 0 420 420" style="position:absolute; top:-100px; right:-100px; opacity:.55;">
    <circle cx="210" cy="210" r="200" fill="none" stroke="oklch(78% 0.15 55)" stroke-width="1.5" opacity=".3"/>
    <circle cx="210" cy="210" r="150" fill="none" stroke="oklch(78% 0.15 55)" stroke-width="1.5" opacity=".45"/>
    <circle cx="210" cy="210" r="100" fill="none" stroke="oklch(78% 0.15 55)" stroke-width="1.5" opacity=".65"/>
    <circle cx="210" cy="210" r="50" fill="none" stroke="oklch(78% 0.15 55)" stroke-width="2" opacity=".85"/>
    <circle cx="210" cy="210" r="10" fill="oklch(78% 0.15 55)"/>
  </svg>
  <div class="pageno">01 / 25</div>
  <div class="eyebrow">Workshop fotografico &middot; 2 ore</div>
  <div class="title-wrap">
    <h1 class="headline">Alternative ad Adobe</h1>
    <div class="subline">darktable &middot; digiKam &middot; Affinity &middot; Synology Photos</div>
    <p class="lede">Uscire da Lightroom, Photoshop, InDesign e dai servizi proprietari senza perdere l'archivio, gli sviluppi e il proprio metodo di lavoro.</p>
  </div>
  <div class="foot">
    <span>A cura di Lorenzo Perone</span>
    <span>Introduzione</span>
  </div>
</div>
</x-dc>
</body>
</html>
